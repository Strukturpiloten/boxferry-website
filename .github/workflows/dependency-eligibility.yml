---
name: Dependency eligibility service

on: # zizmor: ignore[dangerous-triggers] -- Trusted listener delegates only immutable shared code; it never executes candidate code.
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  eligibility:
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'))
    uses: Strukturpiloten/boxferry/.github/workflows/shared-dependency-eligibility.yml@2d9243aa7021b51be319616ea99732c371c4a22d # automation-v1 interface v1
    with:
      automation-sha: 2d9243aa7021b51be319616ea99732c371c4a22d
