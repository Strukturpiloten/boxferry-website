---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned uv toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.5"
      - name: Install checksum-pinned native file-quality tools
        run: sudo bash scripts/install-file-tools.sh /usr/local/bin
      - name: Install pinned Lychee
        # renovate: datasource=crate depName=lychee
        run: cargo install --locked --version 0.24.2 lychee
      - name: Run the complete deterministic repository gate
        env:
          BOXFERRY_WEBSITE_FORMAT_MODE: check
          BOXFERRY_WEBSITE_SOURCE_MODE: locked
        run: ./scripts/check-all.sh

  pr-gate:
    name: PR gate
    if: always()
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every deterministic PR job to succeed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail

          printf 'Required PR job Format, lint, test, and build: %s\n' "${QUALITY_RESULT}"
          {
            printf '## Required PR job results\n\n'
            printf '| Job | Result |\n'
            printf '| --- | --- |\n'
            printf "| Format, lint, test, and build | \`%s\` |\n" "${QUALITY_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${QUALITY_RESULT}" != "success" ]]; then
            echo "::error title=Required PR job did not succeed::Format, lint, test, and build concluded ${QUALITY_RESULT}."
            printf 'Required PR job did not succeed: Format, lint, test, and build concluded %s.\n' \
              "${QUALITY_RESULT}" >&2
            exit 1
          fi
