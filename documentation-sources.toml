schema-version = 1

[site]
content-directory = "content"
staging-directory = ".generated/docs"

[[repositories]]
name = "boxferry"
repository = "https://github.com/Strukturpiloten/boxferry.git"
revision = "bfd59a1be48640fed360b11cdc75fcb89cf618ae"
local-directories = ["../boxferry", "../.."]

[[repositories.documents]]
source = "docs/public/index.md"
destination = "docs/index.md"

[[repositories.documents]]
source = "docs/public/getting-started"
destination = "docs/getting-started"

[[repositories.documents]]
source = "docs/public/guides"
destination = "docs/guides"

[[repositories.documents]]
source = "docs/public/concepts"
destination = "docs/concepts"

[[repositories.documents]]
source = "docs/public/reference"
destination = "docs/reference"

[[repositories.documents]]
source = "docs/public/development"
destination = "docs/development"

[[repositories.documents]]
source = "docs/documentation-examples.toml"
destination = "_data/documentation-examples.toml"

[[repositories]]
name = "compose-lens"
repository = "https://github.com/Strukturpiloten/compose-lens.git"
revision = "47af9a20203368b7614c4622768243381459a886"
local-directories = ["../compose-lens"]

[[repositories.documents]]
source = "docs/public"
destination = "docs/libraries/compose-lens"

[repositories.rustdoc]
package = "compose-lens"
crate = "compose_lens"
destination = "docs/api/compose-lens"

[[repositories]]
name = "podman-lens"
repository = "https://github.com/Strukturpiloten/podman-lens.git"
revision = "968629116aaa94c30d8d81c75adfccfdc8002e8a"
local-directories = ["../podman-lens"]

[[repositories.documents]]
source = "docs/public"
destination = "docs/libraries/podman-lens"

[repositories.rustdoc]
package = "podman-lens"
crate = "podman_lens"
destination = "docs/api/podman-lens"

[[repositories]]
name = "quadlet-lens"
repository = "https://github.com/Strukturpiloten/quadlet-lens.git"
revision = "174129f39b72249618a8f856140f5944f9dd1241"
local-directories = ["../quadlet-lens"]

[[repositories.documents]]
source = "docs/public"
destination = "docs/libraries/quadlet-lens"

[[repositories.documents]]
source = "catalogue/v1/podman-supported-range.toml"
destination = "docs/libraries/quadlet-lens/catalogue/v1/podman-supported-range.toml"

[repositories.rustdoc]
package = "quadlet-lens"
crate = "quadlet_lens"
destination = "docs/api/quadlet-lens"
