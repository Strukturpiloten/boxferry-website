[project]
site_name = "BoxFerry"
site_description = "Source-aware container configuration conversion with clear diagnostics"
site_url = "https://boxferry.dev/"
docs_dir = ".generated/docs"
site_dir = "site"
copyright = "Copyright © Strukturpiloten OHG and BoxFerry contributors"
repo_name = "Strukturpiloten/boxferry"
repo_url = "https://github.com/Strukturpiloten/boxferry"
extra_css = [
  "assets/stylesheets/tokens.css",
  "assets/stylesheets/site.css",
]
nav = [
  { "Docs" = [
    "docs/index.md",
    { "Getting started" = "docs/getting-started/index.md" },
    { "Guides" = [
      "docs/guides/index.md",
      { "Compose input" = [
        "docs/guides/compose-input/index.md",
        { "Compose output" = "docs/guides/convert/compose-to-compose/index.md" },
        { "Podman output" = "docs/guides/convert/compose-to-podman/index.md" },
        { "Quadlet output" = "docs/guides/convert/compose-to-quadlet/index.md" },
      ] },
      { "Podman input" = [
        "docs/guides/podman-input/index.md",
        { "Compose output" = "docs/guides/convert/podman-to-compose/index.md" },
        { "Podman output" = "docs/guides/convert/podman-to-podman/index.md" },
        { "Quadlet output" = "docs/guides/convert/podman-to-quadlet/index.md" },
      ] },
      { "Quadlet input" = [
        "docs/guides/quadlet-input/index.md",
        { "Compose output" = "docs/guides/convert/quadlet-to-compose/index.md" },
        { "Podman output" = "docs/guides/convert/quadlet-to-podman/index.md" },
        { "Quadlet output" = "docs/guides/convert/quadlet-to-quadlet/index.md" },
      ] },
    ] },
    { "Concepts" = "docs/concepts/index.md" },
    { "Reference" = [
      "docs/reference/index.md",
      { "CLI" = "docs/reference/cli/index.md" },
      { "Diagnostics" = "docs/reference/diagnostics/index.md" },
      { "Compatibility" = "docs/reference/compatibility/index.md" },
      { "Error reports" = "docs/reference/error-reports/index.md" },
    ] },
    { "Libraries" = [
      "docs/libraries/index.md",
      { "ComposeLens" = [
        "docs/libraries/compose-lens/index.md",
        { "Model" = "docs/libraries/compose-lens/model/index.md" },
        { "Parsing and rendering" = "docs/libraries/compose-lens/parsing-rendering/index.md" },
        { "Diagnostics" = "docs/libraries/compose-lens/diagnostics/index.md" },
        { "Compatibility" = "docs/libraries/compose-lens/compatibility/index.md" },
      ] },
      { "PodmanLens" = [
        "docs/libraries/podman-lens/index.md",
        { "Acquisition" = "docs/libraries/podman-lens/acquisition/index.md" },
        { "Discovery" = "docs/libraries/podman-lens/discovery/index.md" },
        { "Grouping" = "docs/libraries/podman-lens/grouping/index.md" },
        { "Planning and rendering" = "docs/libraries/podman-lens/planning-rendering/index.md" },
        { "Diagnostics and privacy" = "docs/libraries/podman-lens/diagnostics-privacy/index.md" },
        { "Compatibility" = "docs/libraries/podman-lens/compatibility/index.md" },
      ] },
      { "QuadletLens" = [
        "docs/libraries/quadlet-lens/index.md",
        { "Model" = "docs/libraries/quadlet-lens/model/index.md" },
        { "Parsing and rendering" = "docs/libraries/quadlet-lens/parsing-rendering/index.md" },
        { "Diagnostics" = "docs/libraries/quadlet-lens/diagnostics/index.md" },
        { "Compatibility" = "docs/libraries/quadlet-lens/compatibility/index.md" },
      ] },
    ] },
    { "API" = [
      "docs/api/index.md",
      { "ComposeLens" = "https://boxferry.dev/docs/api/compose-lens/" },
      { "PodmanLens" = "https://boxferry.dev/docs/api/podman-lens/" },
      { "QuadletLens" = "https://boxferry.dev/docs/api/quadlet-lens/" },
    ] },
    { "Development" = [
      "docs/development/index.md",
      { "Architecture" = "docs/development/architecture/index.md" },
      { "Rust API" = "docs/development/rust-api/index.md" },
      { "Testing" = "docs/development/testing/index.md" },
      { "Contributing" = "docs/development/contributing/index.md" },
      { "Releases" = "docs/development/releases/index.md" },
    ] },
    { "Documentation sources" = "docs/sources/index.md" },
  ] },
  { "Support" = "support/index.md" },
]

[project.theme]
custom_dir = "overrides"
favicon = "assets/images/favicon.svg"
font = false
logo = "assets/images/brand/generated/boxferry-mark-dark.svg"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
pymdownx.details = {}
pymdownx.superfences = {}

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true

[project.extra]
contact_url = "https://www.strukturpiloten.de/kontakt?utm_source=boxferry.dev&utm_medium=referral&utm_campaign=boxferry&utm_content=footer_contact"
legal_notice_path = "legal-notice/"
privacy_policy_path = "privacy-policy/"
strukturpiloten_url = "https://www.strukturpiloten.de/?utm_source=boxferry.dev&utm_medium=referral&utm_campaign=boxferry&utm_content=header_company"

# Only formats with published support and input guides belong in this list.
# Both the homepage diagram and guide entries are rendered from these records.
[[project.extra.formats]]
id = "compose"
label = "Docker Compose"
description = "Start with a Compose file and choose an output format."
guide = "docs/guides/compose-input/"

[[project.extra.formats]]
id = "podman"
label = "Podman resources"
description = "Start with Podman resources and choose an output format."
guide = "docs/guides/podman-input/"

[[project.extra.formats]]
id = "quadlet"
label = "Quadlet"
description = "Start with Quadlet files and choose an output format."
guide = "docs/guides/quadlet-input/"

[project.extra.analytics]
provider = "google"
property = "G-TX06VP39B2"
# Account settings confirmed; production collection still requires opt-in. See docs/analytics.md.
enabled = true
policy_version = "2026-11-05-ga4-v2"
consent_days = 180

[project.extra.consent]
title = "Cookie preferences"
description = """
  Optional Google Analytics measures website use, including city-level location and device
  details, with your permission. To allow it,
  select Google Analytics and choose Accept. Reject keeps Analytics off and leaves the
  website usable. Google may process data in the United States. You can change your
  choice using Privacy settings in the footer.
  <a href="/privacy-policy/">Read the Privacy Policy</a>.
"""
actions = ["accept", "reject"]

[project.extra.consent.cookies]
github = false

[project.extra.consent.cookies.analytics]
name = "Google Analytics (optional)"
checked = false

[project.plugins.offline]
enabled = false
