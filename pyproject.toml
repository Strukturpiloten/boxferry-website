[project]
name = "boxferry-website"
version = "0.0.0"
description = "Static product website and unified documentation for BoxFerry"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "zensical==0.1.0",
  "zizmor==1.32.0",
]

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts", "tests"]
