[project]
name = "boxferry-website"
version = "0.0.0"
description = "Static product website and unified documentation for BoxFerry"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.17.0",
  "zensical==0.0.70",
  "zizmor==1.31.0",
]

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.uv]
required-version = "==0.13.1"
